# Reg IRIS API gateway: one origin for the UI and all three services.
# Routing is by resource prefix, so the frontend never needs to know which service owns what.

resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS; resolve lazily so the gateway starts first

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format iris_json escape=json '{"ts":"$time_iso8601","service":"gateway","request_id":"$req_id",'
                                 '"method":"$request_method","path":"$uri","status":$status,'
                                 '"duration_s":$request_time,"upstream":"$upstream_addr"}';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout iris_json;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    set $ingestion http://ingestion-api:8000;
    set $search    http://search-api:8000;
    set $rules     http://rules-api:8000;
    set $frontend  http://frontend:80;

    location = /gateway-health { access_log off; return 200 "ok\n"; }

    # Service-to-service endpoints are never exposed publicly.
    location /internal/ { return 404; }

    # Module 1 — ingestion & versioning
    location ~ ^/api/v1/(documents|versions|whats-new|alerts)(/|$) { proxy_pass $ingestion; }

    # Module 2 — search & comparison
    location ~ ^/api/v1/(search|compare)(/|$) { proxy_pass $search; }

    # Module 3 — rules & impact analysis (streaming CSV export: no buffering)
    location ~ ^/api/v1/(rule-sets|rules|datasets|runs|evaluate|schemas)(/|$) {
        proxy_buffering off;
        proxy_pass $rules;
    }

    # Per-service OpenAPI specs (Swagger UIs are on :8001/:8002/:8003/docs)
    location = /openapi/ingestion.json { proxy_pass $ingestion/openapi.json; }
    location = /openapi/search.json    { proxy_pass $search/openapi.json; }
    location = /openapi/rules.json     { proxy_pass $rules/openapi.json; }

    location / { proxy_pass $frontend; }
}
