name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff==0.8.4
      - run: ruff check libs services scripts

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [libs/iris-common, services/ingestion-service, services/search-service, services/rules-engine-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - name: Install
        run: |
          pip install -e libs/iris-common pytest==8.3.4 pytest-cov==6.0.0
          if [ -f ${{ matrix.component }}/requirements-dev.txt ]; then pip install -r ${{ matrix.component }}/requirements-dev.txt; fi
      - name: Test
        working-directory: ${{ matrix.component }}
        run: pytest --cov=. --cov-report=term-missing:skip-covered --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ strategy.job-index }}
          path: ${{ matrix.component }}/junit.xml

  migrations:
    # Runs every service's Alembic migrations against a real PostgreSQL (catches PG-only DDL issues).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env: {POSTGRES_USER: iris, POSTGRES_PASSWORD: iris, POSTGRES_DB: postgres}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U iris" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e libs/iris-common -r services/ingestion-service/requirements.txt -r services/search-service/requirements.txt -r services/rules-engine-service/requirements.txt
      - name: Upgrade, check drift, downgrade, upgrade
        env: {PGPASSWORD: iris}
        run: |
          for svc in ingestion-service search-service rules-engine-service; do
            db="iris_${svc%%-*}"
            psql -h localhost -U iris -d postgres -c "CREATE DATABASE $db"
            export DATABASE_URL="postgresql+psycopg://iris:iris@localhost:5432/$db"
            (cd services/$svc && alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head)
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-images:
    needs: [python-tests, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: ingestion-service, context: ., file: services/ingestion-service/Dockerfile}
          - {name: search-service, context: ., file: services/search-service/Dockerfile}
          - {name: rules-engine-service, context: ., file: services/rules-engine-service/Dockerfile}
          - {name: frontend, context: frontend, file: frontend/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: reg-iris/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose-smoke:
    # Definition of Done: the whole stack starts with one command. Runs on main only (slower).
    if: github.ref == 'refs/heads/main'
    needs: [docker-images, migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 scripts/seed_sample_data.py --base-url http://localhost:8080
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
